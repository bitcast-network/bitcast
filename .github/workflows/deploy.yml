name: Deploy Validator to AWS ECS

on:
  push:
    branches: [main]
    paths:
      - 'bitcast/**'
      - 'neurons/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'bitcast' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'bitcast-youtube-validator' }}

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tag: ${{ github.sha }}
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker build --no-cache -t "local/bitcast-youtube-validator:$IMAGE_TAG" .

      - name: Save image archive
        id: archive
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker save "local/bitcast-youtube-validator:$IMAGE_TAG" | gzip -1 > image.tar.gz
          echo "sha256=$(sha256sum image.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload image archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validator-image
          path: image.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy-canary:
    name: Deploy Canary (validator1)
    needs: build
    runs-on: ubuntu-latest
    # No reviewers: canary still deploys before the Production approval gate.
    environment: canary
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download image archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validator-image

      - name: Verify and load image
        env:
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
        run: |
          echo "$ARCHIVE_SHA256  image.tar.gz" | sha256sum --check --strict
          gunzip -c image.tar.gz | docker load

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::289997608167:role/deploy-bitcast-canary
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@4625ce35226a7557230889aae2f52eb50ec3dcda # v2.0.1

      - name: Push image if missing
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" > /dev/null; then
            docker tag "local/bitcast-youtube-validator:$IMAGE_TAG" "$IMAGE"
            docker push "$IMAGE"
          fi
          # Preserve the latest tag used by Terraform task definitions.
          docker tag "local/bitcast-youtube-validator:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy canary to ECS
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          SERVICE: ${{ vars.ECS_SERVICE_CANARY || 'bitcast-youtube-validator1' }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Deploying $IMAGE to $SERVICE (canary)"
          # Clone the newest TERRAFORM-MANAGED revision (ManagedBy=terraform tag),
          # not the latest revision: deploy-driven revisions drift away from the
          # reviewed terraform template (this bit us when an interim deploy
          # dropped the LOKI_* rows that terraform had added).
          TEMPLATE_TASK=""
          LATEST_REV=$(aws ecs describe-task-definition \
            --task-definition "$SERVICE" \
            --query 'taskDefinition.revision' \
            --output text)
          for REV in $(seq "$LATEST_REV" -1 1); do
            CANDIDATE_JSON=$(aws ecs describe-task-definition \
              --task-definition "${SERVICE}:${REV}" \
              --include TAGS \
              --output json 2>/dev/null) || continue
            if jq -e 'any((.tags // .Tags)[]?; (.key // .Key) == "ManagedBy" and (.value // .Value) == "terraform")' \
                <<<"$CANDIDATE_JSON" > /dev/null; then
              TEMPLATE_TASK="${SERVICE}:${REV}"
              jq '.taskDefinition' <<<"$CANDIDATE_JSON" > "task-def.json"
              break
            fi
          done
          if [ -z "$TEMPLATE_TASK" ]; then
            echo "No terraform-managed template revision found for $SERVICE" >&2
            exit 1
          fi
          echo "Using terraform template: $TEMPLATE_TASK"
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            "task-def.json" > "clean.json"
          jq --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE' \
            "clean.json" > "new.json"
          ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://new.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$ARN" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$SERVICE"
          echo "✅ Canary ($SERVICE) deployed"

  deploy-owner:
    name: Deploy Owner (production gate)
    needs: [build, deploy-canary]
    runs-on: ubuntu-latest
    # Approval gate — requires manual "Review deployments" click in GitHub Actions.
    # This is the safety net: if canary is broken, don't approve.
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download image archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validator-image

      - name: Verify and load image
        env:
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
        run: |
          echo "$ARCHIVE_SHA256  image.tar.gz" | sha256sum --check --strict
          gunzip -c image.tar.gz | docker load

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::289997608167:role/deploy-bitcast-production
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@4625ce35226a7557230889aae2f52eb50ec3dcda # v2.0.1

      - name: Push image if missing
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" > /dev/null; then
            docker tag "local/bitcast-youtube-validator:$IMAGE_TAG" "$IMAGE"
            docker push "$IMAGE"
          fi

      - name: Deploy owner to ECS
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          SERVICE: ${{ vars.ECS_SERVICE_OWNER || 'bitcast-youtube-owner' }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Deploying $IMAGE to $SERVICE (owner/production)"
          # Clone the newest TERRAFORM-MANAGED revision (ManagedBy=terraform tag),
          # not the latest revision: deploy-driven revisions drift away from the
          # reviewed terraform template (this bit us when an interim deploy
          # dropped the LOKI_* rows that terraform had added).
          TEMPLATE_TASK=""
          LATEST_REV=$(aws ecs describe-task-definition \
            --task-definition "$SERVICE" \
            --query 'taskDefinition.revision' \
            --output text)
          for REV in $(seq "$LATEST_REV" -1 1); do
            CANDIDATE_JSON=$(aws ecs describe-task-definition \
              --task-definition "${SERVICE}:${REV}" \
              --include TAGS \
              --output json 2>/dev/null) || continue
            if jq -e 'any((.tags // .Tags)[]?; (.key // .Key) == "ManagedBy" and (.value // .Value) == "terraform")' \
                <<<"$CANDIDATE_JSON" > /dev/null; then
              TEMPLATE_TASK="${SERVICE}:${REV}"
              jq '.taskDefinition' <<<"$CANDIDATE_JSON" > "task-def.json"
              break
            fi
          done
          if [ -z "$TEMPLATE_TASK" ]; then
            echo "No terraform-managed template revision found for $SERVICE" >&2
            exit 1
          fi
          echo "Using terraform template: $TEMPLATE_TASK"
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            "task-def.json" > "clean.json"
          jq --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE' \
            "clean.json" > "new.json"
          ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://new.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$ARN" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$SERVICE"
          echo "✅ Owner ($SERVICE) deployed"
